<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="1200" height="32">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e7bff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#2a7bff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#4db2ff"/>
      <stop offset="0.7" stop-color="#2a7bff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1e7bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a7bff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2a7bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2a7bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4db2ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#bfe3ff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="streakR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#4db2ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#bfe3ff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fa4ff"/>
      <stop offset="1" stop-color="#0a5cff"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- main line -->
  <rect x="0" y="15" width="1200" height="2" rx="1" fill="url(#line)"/>
  <!-- secondary thin lines -->
  <rect x="140" y="9" width="400" height="1" fill="url(#dash)"/>
  <rect x="660" y="9" width="400" height="1" fill="url(#dash)"/>
  <rect x="140" y="22" width="400" height="1" fill="url(#dash)"/>
  <rect x="660" y="22" width="400" height="1" fill="url(#dash)"/>

  <!-- tick marks -->
  <g stroke="#2a7bff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round">
    <path d="M240 11 V21 M300 12 V20 M360 11 V21 M420 12 V20 M480 11 V21"/>
    <path d="M960 11 V21 M900 12 V20 M840 11 V21 M780 12 V20 M720 11 V21"/>
  </g>

  <!-- traveling packets -->
  <rect y="14.5" width="80" height="3" rx="1.5" fill="url(#streak)">
    <animate attributeName="x" values="60;520;520" keyTimes="0;0.7;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.65;0.7" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect y="14.5" width="80" height="3" rx="1.5" fill="url(#streakR)">
    <animate attributeName="x" values="1060;600;600" keyTimes="0;0.7;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.65;0.7" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- center emblem -->
  <g transform="translate(600 16)">
    <!-- pulsing ring -->
    <circle r="11" fill="none" stroke="#4db2ff" stroke-width="1.5">
      <animate attributeName="r" values="9;15;9" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <!-- bracket wings -->
    <path d="M-36 -7 L-44 0 L-36 7" fill="none" stroke="#2fa4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <path d="M36 -7 L44 0 L36 7" fill="none" stroke="#2fa4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <rect x="-28" y="-2" width="4" height="4" rx="1" fill="#2a7bff" opacity="0.8"/>
    <rect x="24" y="-2" width="4" height="4" rx="1" fill="#2a7bff" opacity="0.8"/>
    <!-- glow + diamond -->
    <path d="M0 -10 L10 0 L0 10 L-10 0 Z" fill="#1e7bff" opacity="0.7" filter="url(#glow)"/>
    <path d="M0 -9 L9 0 L0 9 L-9 0 Z" fill="#05080f" stroke="url(#core)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M0 -4.5 L4.5 0 L0 4.5 L-4.5 0 Z" fill="url(#core)">
      <animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- end caps -->
  <circle cx="140" cy="16" r="2.5" fill="#2a7bff" opacity="0.8"/>
  <circle cx="1060" cy="16" r="2.5" fill="#2a7bff" opacity="0.8"/>
</svg>
