<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#130720"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="brandV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.1" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.95" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="0.6" cy="0.05" r="0.4">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="400" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- background -->
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
    <rect width="1200" height="400" fill="url(#orbA)"/>
    <rect width="1200" height="400" fill="url(#orbB)"/>
    <rect width="1200" height="400" fill="url(#orbC)"/>

    <!-- rotating rings -->
    <g transform="translate(290 200)" opacity="0.5">
      <circle r="175" fill="none" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      </circle>
      <circle r="135" fill="none" stroke="#f472b6" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="2 12">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="45s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- stars -->
    <g fill="#fff">
      <circle cx="110" cy="60" r="1.6"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="44" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="650" cy="80" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1130" cy="46" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="580" cy="360" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="335" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ============ LEFT: BRAND ============ -->
    <g font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">

      <!-- logo: shield + lock -->
      <g transform="translate(74 66)" filter="url(#glow)">
        <path d="M30 0 L56 10 V32 C56 48 44 58 30 64 C16 58 4 48 4 32 V10 Z" fill="#0b0a28" stroke="url(#brandV)" stroke-width="3" stroke-linejoin="round"/>
        <rect x="19" y="28" width="22" height="17" rx="3.5" fill="url(#brand)"/>
        <path d="M23 28 V23 a7 7 0 0 1 14 0 V28" fill="none" stroke="url(#brand)" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="30" cy="36" r="2.4" fill="#0b0a28"/>
      </g>
      <text x="150" y="94" font-size="15" font-weight="700" fill="#a5b4fc" letter-spacing="5">SHADOWSOCKS SERVER</text>

      <!-- title -->
      <text x="70" y="208" font-size="118" font-weight="900" fill="url(#brand)" letter-spacing="3" filter="url(#glow)">PRO-LYX</text>
      <text x="70" y="208" font-size="118" font-weight="900" fill="url(#brand)" letter-spacing="3">PRO-LYX</text>

      <!-- shine -->
      <rect x="-300" y="106" width="220" height="130" fill="url(#sweep)" opacity="0.22" transform="skewX(-20)">
        <animate attributeName="x" values="-300;900;900" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/>
      </rect>

      <!-- underline -->
      <rect x="74" y="226" width="150" height="4" rx="2" fill="url(#brand)"/>
      <rect x="232" y="226" width="22" height="4" rx="2" fill="#f472b6" fill-opacity="0.7"/>
      <rect x="262" y="226" width="8" height="4" rx="2" fill="#f472b6" fill-opacity="0.4"/>

      <!-- tagline -->
      <text x="74" y="272" font-size="27" font-weight="500" fill="#e0e7ff">سيرفر Shadowsocks خفيف. من غير أي مكتبات.</text>
      <text x="74" y="304" font-size="17" fill="#94a3b8" letter-spacing="0.5">Zero dependencies · Auto port &amp; IP detection · Ready ss:// link</text>

      <!-- pills -->
      <g font-size="14" font-weight="700">
        <g transform="translate(74 332)">
          <rect width="136" height="32" rx="16" fill="#06b6d4" fill-opacity="0.18" stroke="#22d3ee" stroke-opacity="0.7"/>
          <circle cx="20" cy="16" r="4" fill="#22d3ee"/>
          <text x="32" y="21" fill="#a5f3fc">aes-256-gcm</text>
        </g>
        <g transform="translate(222 332)">
          <rect width="108" height="32" rx="16" fill="#7c3aed" fill-opacity="0.2" stroke="#a78bfa" stroke-opacity="0.7"/>
          <circle cx="20" cy="16" r="4" fill="#a78bfa"/>
          <text x="32" y="21" fill="#ddd6fe">0 deps</text>
        </g>
        <g transform="translate(342 332)">
          <rect width="100" height="32" rx="16" fill="#ec4899" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.7"/>
          <circle cx="20" cy="16" r="4" fill="#f472b6"/>
          <text x="32" y="21" fill="#fbcfe8">Node 16+</text>
        </g>
        <g transform="translate(454 332)">
          <rect width="116" height="32" rx="16" fill="#10b981" fill-opacity="0.18" stroke="#34d399" stroke-opacity="0.7"/>
          <circle cx="20" cy="16" r="4" fill="#34d399"/>
          <text x="32" y="21" fill="#a7f3d0">Katabump</text>
        </g>
      </g>
    </g>

    <!-- ============ RIGHT: TUNNEL SCENE ============ -->
    <g font-family="'Segoe UI','Inter',Arial,sans-serif">

      <!-- tunnel band -->
      <g transform="translate(0 0)">
        <rect x="700" y="132" width="460" height="56" rx="28" fill="url(#tunnel)" stroke="#a78bfa" stroke-opacity="0.35"/>
        <!-- flowing packets -->
        <g fill="#fff">
          <rect y="154" width="22" height="12" rx="6" fill="#67e8f9">
            <animate attributeName="x" values="740;1100" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
          </rect>
          <rect y="154" width="22" height="12" rx="6" fill="#a78bfa">
            <animate attributeName="x" values="740;1100" dur="3s" begin="1s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="1s" repeatCount="indefinite"/>
          </rect>
          <rect y="154" width="22" height="12" rx="6" fill="#f472b6">
            <animate attributeName="x" values="740;1100" dur="3s" begin="2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="2s" repeatCount="indefinite"/>
          </rect>
        </g>
        <text x="930" y="124" font-size="12" font-weight="700" fill="#c4b5fd" text-anchor="middle" letter-spacing="3">ENCRYPTED TUNNEL</text>
      </g>

      <!-- client node -->
      <g transform="translate(676 130)">
        <animateTransform attributeName="transform" type="translate" values="676 130;676 124;676 130" dur="5s" repeatCount="indefinite"/>
        <circle cx="30" cy="30" r="32" fill="url(#glass)" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2"/>
        <text x="30" y="40" font-size="28" text-anchor="middle">📱</text>
        <text x="30" y="78" font-size="12" font-weight="700" fill="#a5f3fc" text-anchor="middle">Client</text>
      </g>

      <!-- server node -->
      <g transform="translate(1110 130)">
        <animateTransform attributeName="transform" type="translate" values="1110 130;1110 136;1110 130" dur="5s" repeatCount="indefinite"/>
        <circle cx="30" cy="30" r="32" fill="url(#glass)" stroke="#f472b6" stroke-opacity="0.7" stroke-width="2"/>
        <text x="30" y="40" font-size="28" text-anchor="middle">🛡️</text>
        <text x="30" y="78" font-size="12" font-weight="700" fill="#fbcfe8" text-anchor="middle">PRO-LYX</text>
      </g>

      <!-- terminal card -->
      <g transform="translate(720 232)" filter="url(#shadow)">
        <animateTransform attributeName="transform" type="translate" values="720 232;720 238;720 232" dur="6s" repeatCount="indefinite"/>
        <rect width="420" height="136" rx="16" fill="#080813" fill-opacity="0.92" stroke="#8b5cf6" stroke-opacity="0.5"/>
        <path d="M0 16 Q0 0 16 0 H404 Q420 0 420 16 V32 H0 Z" fill="#1b1744"/>
        <circle cx="22" cy="16" r="5" fill="#ef4444"/>
        <circle cx="40" cy="16" r="5" fill="#f59e0b"/>
        <circle cx="58" cy="16" r="5" fill="#22c55e"/>
        <text x="210" y="20" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#818cf8" text-anchor="middle">pro-lyx — node server.js</text>
        <g font-family="Consolas,'Courier New',monospace" font-size="13">
          <text x="18" y="56" fill="#34d399">$ npm start</text>
          <text x="18" y="76" fill="#94a3b8">✔ Port detected: <tspan fill="#67e8f9">24691</tspan>  ·  Public IP found</text>
          <text x="18" y="96" fill="#94a3b8">✔ Method: <tspan fill="#c4b5fd">aes-256-gcm</tspan></text>
          <text x="18" y="116" fill="#f9a8d4">▶ ss://YWVzLTI1Ni1nY206••••@host:port</text>
          <rect x="396" y="105" width="8" height="14" fill="#a78bfa">
            <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>

    <!-- bottom light -->
    <rect x="0" y="397" width="1200" height="3" fill="url(#brand)" opacity="0.35"/>
    <rect x="-200" y="396" width="200" height="4" fill="url(#sweep)">
      <animate attributeName="x" values="-200;1200" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- border -->
    <rect x="1.5" y="1.5" width="1197" height="397" rx="25" fill="none" stroke="url(#brand)" stroke-opacity="0.6" stroke-width="2"/>
  </g>
</svg>
